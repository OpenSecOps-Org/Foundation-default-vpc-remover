Comment: A state machine that removes the default VPCs from all regions.
StartAt: For each account
States:
  For each account:
    Type: Map
    ItemsPath: $.AccountIds
    Parameters:
      AccountId.$: $$.Map.Item.Value
      Regions.$: $.Regions
    MaxConcurrency: 1
    Iterator:
      StartAt: Remove All Default VPCs for an Account
      States:
        Remove All Default VPCs for an Account:
          Type: Task
          Resource: '${RemoveDefaultVpcsFunctionArn}'
          ResultPath: $.Result
          Retry:
            - ErrorEquals:
                - AWSTransientError
                - Lambda.ServiceException
                - Lambda.AWSLambdaException
                - Lambda.SdkClientException
                - Lambda.TooManyRequestsException
              IntervalSeconds: 5
              MaxAttempts: 20
              BackoffRate: 2
              MaxDelaySeconds: 300
              JitterStrategy: FULL
          End: true
    End: true
